name: Actualizar datos y publicar

on:
  schedule:
    - cron: '17 * * * *'   # cada hora, en el minuto 17
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests lxml pyproj google-genai

      - name: Generar datos
        id: gen
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/actualizar_datos.py

      - name: Preparar sitio
        run: |
          mkdir _site
          cp -r *.html *.jpg *.png *.ico CNAME ads.txt robots.txt sitemap.xml data _site/
          touch _site/.nojekyll

      - name: Generar páginas de vías, sitemap y robots
        run: python scripts/generar_paginas.py _site

      - name: Guardar datos nuevos (solo si todo fue bien)
        if: steps.gen.outcome == 'success'
        run: |
          git config user.name "TechDEV: OI_ZGZ Data Bot "
          git config user.email "oi_zgz.dev@techecs.net"
          git add data
          git diff --cached --quiet || (git commit -m "chore(data): actualizar incidencias" && git push)

      - name: Aviso si falló
        if: steps.gen.outcome == 'failure'
        run: echo "::warning::No se obtuvieron datos válidos; se publica la última versión buena."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
        
